{% extends "base.html" %}
{% block content %}
<div style="margin-bottom:24px;">
    <a href="{% url 'incidente-detalle' incidente.pk %}" class="sgic-btn sgic-btn-secondary" style="padding:12px 28px;font-size:0.95rem;">&larr; Volver al detalle</a>
</div>

<div class="sgic-card">
    <div class="sgic-card-header">
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="card-header-accent" style="background:var(--sgic-accent);"></div>
            <h5 style="margin:0;font-size:1.05rem;font-weight:600;">Asignar Especialista — {{ incidente.codigo }}</h5>
        </div>
    </div>
    <div class="sgic-card-body">
        {% if especialistas %}
            <form method="POST">
                {% csrf_token %}
                <div style="display:flex;flex-direction:column;gap:8px;">
                    {% for especialista in especialistas %}
                    <label style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--sgic-border);border-radius:var(--sgic-radius);cursor:pointer;transition:var(--sgic-transition);margin:0;" onmouseover="this.style.borderColor='var(--sgic-accent-light)'" onmouseout="this.style.borderColor='var(--sgic-border)'">
                        <input type="radio" name="especialista_pk" value="{{ especialista.pk }}" required style="accent-color:var(--sgic-accent);width:16px;height:16px;flex-shrink:0;">
                        <div style="flex:1;">
                            <div style="font-weight:600;font-size:0.9rem;">{{ especialista.nombre }} {{ especialista.apellidos }}</div>
                            <div style="display:flex;gap:8px;margin-top:4px;">
                                <span style="font-size:0.75rem;padding:1px 8px;background:rgba(25,118,210,0.1);color:var(--sgic-accent);border-radius:10px;">Exp: {{ especialista.exp_tipo }}</span>
                                <span style="font-size:0.75rem;padding:1px 8px;background:rgba(237,108,2,0.1);color:var(--sgic-warning);border-radius:10px;">Activos: {{ especialista.casos_activos }}</span>
                                <span style="font-size:0.75rem;padding:1px 8px;background:rgba(46,125,50,0.1);color:var(--sgic-success);border-radius:10px;">Resueltos: {{ especialista.total_resueltos }}</span>
                            </div>
                        </div>
                    </label>
                    {% endfor %}
                </div>
                <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--sgic-border);">
                    <button type="submit" class="sgic-btn sgic-btn-success" style="padding:10px 28px;">Asignar Especialista</button>
                </div>
            </form>
        {% else %}
            <p style="color:var(--sgic-text-light);font-size:0.9rem;margin:0;">No hay especialistas disponibles.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
