{% extends "base.html" %}

{% block title %}Cerrar Sesión{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center p-5">
                    <h1 class="card-title mb-4">¡Hasta Luego!</h1>
                    <p class="card-text fs-5 text-muted mb-4">
                        Has cerrado sesión correctamente.
                    </p>
                    
                    <div class="alert alert-success" role="alert">
                        <strong>Sesión cerrada:</strong> Tu usuario ha sido desconectado del sistema.
                    </div>

                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary">
                            Iniciar Sesión Nuevamente
                        </a>
                        <a href="{% url 'admin:index' %}" class="btn btn-secondary">
                            Ir a Panel de Control
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
