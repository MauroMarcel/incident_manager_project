{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión expirada — SGIC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/sgic-theme.css' %}">
</head>
<body style="background:var(--sgic-bg);min-height:100vh;display:flex;align-items:center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="sgic-card text-center p-4">
                    <div class="sgic-card-body">
                        <div style="font-size:3rem;margin-bottom:16px;">⚠️</div>
                        <h4>Sesión expirada o solicitud inválida</h4>
                        <p class="text-muted mb-4">Tu sesión puede haber cambiado o expirado. Por favor recarga la página e intenta de nuevo.</p>
                        <div class="d-flex gap-2 justify-content-center">
                            <a href="/" class="sgic-btn sgic-btn-primary">Volver al inicio</a>
                            <a href="/accounts/login/" class="sgic-btn sgic-btn-secondary">Iniciar sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
